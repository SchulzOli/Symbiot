[workspace]
resolver = "3"
members = ["crates/symbiot-core", "crates/symbiot-store", "crates/symbiot-ai", "crates/symbiot-sync", "crates/symbiot-import", "crates/symbiot-words", "apps/server", "apps/ui", "apps/desktop"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SchulzOli/Symbiot"

# Signatures and hashes are slow without optimisation, and the tests check thousands of them.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
