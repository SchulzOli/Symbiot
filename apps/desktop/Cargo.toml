[package]
name = "symbiot-desktop"
description = "Symbiot — Tauri shell for desktop and mobile around the shared Leptos UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "symbiot_desktop_lib"
# staticlib/cdylib are needed for Android and iOS (M5).
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
symbiot-ai = { version = "0.4.0", path = "../../crates/symbiot-ai" }
symbiot-core = { version = "0.4.0", path = "../../crates/symbiot-core" }
symbiot-import = { version = "0.4.0", path = "../../crates/symbiot-import" }
symbiot-store = { version = "0.4.0", path = "../../crates/symbiot-store" }
symbiot-sync = { version = "0.4.0", path = "../../crates/symbiot-sync" }
tauri = { version = "2.12.5", features = [] }
