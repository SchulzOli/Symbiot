[package]
name = "symbiot-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symbiot-ai = { version = "0.3.0", path = "../../crates/symbiot-ai" }
symbiot-core = { version = "0.3.0", path = "../../crates/symbiot-core" }
symbiot-import = { version = "0.3.0", path = "../../crates/symbiot-import" }
symbiot-store = { version = "0.3.0", path = "../../crates/symbiot-store" }
symbiot-sync = { version = "0.3.0", path = "../../crates/symbiot-sync" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
ureq = { version = "3.5.0", features = ["json"] }
