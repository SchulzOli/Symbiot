[package]
name = "symbiot-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
symbiot-core = { version = "0.3.0", path = "../../crates/symbiot-core" }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window"] }
