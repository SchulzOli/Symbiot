[package]
name = "symbiot-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# E6: the database file is encrypted with SQLCipher (AES-256). Building it compiles OpenSSL from
# source, which needs perl and make. Switched on by the server; the apps follow with H5.
encryption = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symbiot-core = { version = "0.3.0", path = "../symbiot-core" }
symbiot-words = { version = "0.3.0", path = "../symbiot-words" }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
