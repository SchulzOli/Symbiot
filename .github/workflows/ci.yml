name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test · no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The desktop crate needs WebKitGTK and the built UI; it has its own job.
      - name: Clippy
        run: cargo clippy --workspace --exclude symbiot-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude symbiot-desktop
      - name: Core builds without std (ESP32-C3)
        run: cargo build -p symbiot-core --target riscv32imc-unknown-none-elf
      - name: Clippy UI for WASM
        run: cargo clippy -p symbiot-ui --target wasm32-unknown-unknown -- -D warnings

  ui-desktop:
    name: UI (WASM) · Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: trunk build
        working-directory: apps/ui
        run: trunk build --release
      - name: Clippy desktop
        run: cargo clippy -p symbiot-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
