name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test · no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The desktop crate needs WebKitGTK and the built UI; it has its own job.
      - name: Clippy
        run: cargo clippy --workspace --exclude symbiot-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude symbiot-desktop
      - name: Core builds without std (ESP32-C3)
        run: cargo build -p symbiot-core --target riscv32imc-unknown-none-elf
      - name: Clippy UI for WASM
        run: cargo clippy -p symbiot-ui --target wasm32-unknown-unknown -- -D warnings

  ui-desktop:
    name: UI (WASM) · Desktop (Tauri) · E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - name: Cache trunk tools (wasm-bindgen, wasm-opt)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trunk
            ~/Library/Caches/trunk
            ~/AppData/Local/trunk
          key: trunk-tools-${{ runner.os }}-0.22.1-${{ hashFiles('Cargo.lock', 'apps/ui/Trunk.toml') }}
          restore-keys: trunk-tools-${{ runner.os }}-0.22.1-
      - name: trunk build
        working-directory: apps/ui
        # Downloads from GitHub Releases fail now and then; retry instead of failing the job.
        run: |
          for i in 1 2 3; do
            trunk build --release && exit 0
            echo "trunk build failed (attempt $i), retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Clippy desktop
        run: cargo clippy -p symbiot-desktop --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: E2E (Playwright against the real server + UI)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
