name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test · no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Core builds without std (ESP32-C3)
        run: cargo build -p symbiot-core --target riscv32imc-unknown-none-elf
      - name: Clippy UI for WASM
        run: cargo clippy -p symbiot-ui --target wasm32-unknown-unknown -- -D warnings

  ui:
    name: UI build (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: trunk build
        working-directory: apps/ui
        run: trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: apps/ui/dist
