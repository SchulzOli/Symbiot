name: Fehler
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was hätte passieren sollen?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Wo? (Desktop / Web auf dem Heimserver / Android, Version)
