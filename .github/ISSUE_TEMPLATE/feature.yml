name: Feature
description: Neues Feature oder Erweiterung
labels: [feature]
body:
  - type: textarea
    id: why
    attributes:
      label: Wozu?
      description: Welches Problem löst es, für wen?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Fertig, wenn …
      description: Abnahmekriterien (Test grün · in der App sichtbar · auf dem Heimserver deployed · im Ledger nachvollziehbar)
    validations:
      required: true
